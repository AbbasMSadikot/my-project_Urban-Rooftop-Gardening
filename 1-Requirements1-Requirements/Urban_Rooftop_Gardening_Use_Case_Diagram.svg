<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">Urban Rooftop Gardening Co-op App Use Case Diagram</title>
<desc id="desc">UML use-case diagram with Co-op Gardener, Community Member, and Community Leader actors. Logging planting includes calculating harvest estimates. Requesting produce optionally extends browsing surplus listings.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.boundary{fill:#f8fafc;stroke:#334155;stroke-width:2}.uc{fill:#fff;stroke:#2563eb;stroke-width:2}.label{font-size:16px;text-anchor:middle}.actor{stroke:#172033;stroke-width:3;fill:none;stroke-linecap:round}.actorlabel{font-size:16px;text-anchor:middle;font-weight:bold}.assoc{stroke:#64748b;stroke-width:1.5;fill:none}.rel{stroke:#334155;stroke-width:1.8;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}.reltext{font-size:14px;font-weight:bold;fill:#1d4ed8}.heading{font-size:23px;font-weight:bold;text-anchor:middle}</style></defs>
